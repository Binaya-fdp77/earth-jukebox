<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NASA EIC | Earth Jukebox HD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<style>
:root{--bg:#0b0d12;--panel:rgba(14,17,23,.93);--line:rgba(255,255,255,.09);--mut:#8a91a0;--acc:#ff8a1f;--acc2:#ffd29a;--bh:110px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#e8eaf0;font-family:Inter,system-ui,sans-serif;overflow:hidden;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.mono{font-family:'JetBrains Mono',monospace}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#0e1117;border-bottom:1px solid var(--line);position:relative;z-index:30}
header a{color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
header a:hover{color:#fff}
.title{font-weight:800;letter-spacing:.16em;font-size:13px;white-space:nowrap}
.title span{color:var(--acc)}
.srch{position:relative;flex:1 1 200px;max-width:340px;margin-left:auto}
.srch input{width:100%;padding:8px 30px 8px 34px;font-size:13px}
.srch .s{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12px;pointer-events:none}
#cx{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:0;border:0;color:var(--mut);cursor:pointer;font-size:13px;display:none;padding:4px 6px}
#cres{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#141821;border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;display:none;box-shadow:0 20px 40px -10px #000}
#cres div{padding:9px 12px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#cres div.act,#cres div:hover{background:rgba(255,138,31,.18)}
#mapWrap{position:relative;min-width:0;min-height:0;background:#07080a;overflow:hidden}
#globeViz{position:absolute;inset:0}
.fl{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px -12px #000}
#side{position:absolute;left:12px;top:12px;bottom:calc(var(--bh) + 24px);width:310px;display:flex;flex-direction:column;z-index:6;overflow:hidden}
.hidep #side{display:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px}
.sh b{font-size:14px}
.sp1{padding:0 12px 8px}
.sp1 input{width:100%}
#legend{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 10px;border-bottom:1px solid var(--line)}
#list{flex:1;min-height:0;overflow-y:auto}
.chip{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#cbd5e1;font:600 11px Inter;cursor:pointer;transition:.15s}
.chip:hover:not(:disabled){background:rgba(255,255,255,.12)}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 24%,transparent);color:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:.12s}
.row:hover{background:rgba(255,255,255,.05)}
.row.sel{background:rgba(255,138,31,.14);box-shadow:inset 3px 0 var(--acc)}
.pb{flex:none;width:26px;height:26px;border-radius:50%;border:0;background:var(--acc);color:#1a0d00;cursor:pointer;font-size:9px;transition:.12s}
.pb:hover{background:var(--acc2);transform:scale(1.1)}
.dl{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
.dl dt{color:var(--mut)}
.dl dd{margin:0;text-align:right}
input[type=search],input[type=text],select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;outline:none;color-scheme:dark;font-family:Inter,sans-serif}
input:focus,select:focus{border-color:var(--acc)}
#zc{position:absolute;right:12px;top:12px;z-index:7;display:flex;flex-direction:column;gap:5px;padding:5px}
#zc button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#e5e7eb;font:700 12px Inter;cursor:pointer;transition:.15s}
#zc button:hover{background:var(--acc);color:#1a0d00}
#zc button.off{opacity:.45}
#zc hr{border:0;border-top:1px solid var(--line);margin:1px 0;width:100%}
#hd,#hint{position:absolute;z-index:6;font-size:11px;color:#cbd5e1;padding:6px 11px;pointer-events:none}
#hd{top:12px;left:50%;transform:translateX(-50%);transition:opacity 1s}
#hint{right:62px;top:12px;max-width:230px;line-height:1.45;animation:fo 1s 14s forwards}
@keyframes fo{to{opacity:0}}
#card{position:absolute;right:62px;top:12px;z-index:8;width:320px;max-width:calc(100% - 80px);max-height:calc(100% - var(--bh) - 40px);overflow:auto;display:none;padding:16px}
#cardx{position:absolute;right:8px;top:8px;background:0;border:0;color:var(--mut);font-size:15px;cursor:pointer;padding:4px 8px}
#cardx:hover{color:#fff}
#bar{position:absolute;left:12px;right:12px;bottom:12px;z-index:7;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.ra{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button,.sp button{background:rgba(255,255,255,.05);border:0;color:#cbd5e1;font:700 11px Inter;padding:6px 10px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--acc);color:#1a0d00}
.sp{display:flex;gap:3px}
.sp button{border:1px solid var(--line);border-radius:7px;font-family:'JetBrains Mono',monospace;padding:6px 8px}
.sp button.on{background:var(--acc);color:#1a0d00}
#play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(180deg,#ff9a3c,#e8710a);color:#1a0d00;font-size:17px;cursor:pointer;transition:.12s}
#play:hover{filter:brightness(1.1)}
#play:disabled{opacity:.4}
#play.on{background:#2a2b30;color:#fff;border:1px solid var(--line)}
.track{position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#prog{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#slider{position:absolute;inset:-6px 0;width:100%;opacity:0;cursor:pointer}
.tw{position:relative;flex:1}
.tip{font:12px Inter;background:#111214;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
@media(max-width:820px){#side{left:8px;right:8px;width:auto;top:auto;height:40%}#hint{display:none}#card{right:8px;left:8px;top:8px;width:auto;max-width:none}#zc{top:auto;bottom:calc(var(--bh) + 24px)}.srch{margin-left:0}.title{font-size:11px}}
#evb{position:absolute;left:12px;top:12px;z-index:6;padding:10px 14px;color:#fff;font:700 12px Inter;cursor:pointer;display:flex;gap:8px;align-items:center}
body:not(.hidep) #evb{display:none}
#evb:hover{border-color:var(--acc)}
#sidex{background:0;border:0;color:var(--mut);cursor:pointer;font-size:15px;padding:2px 6px}
#sidex:hover{color:#fff}
#side{width:300px}
#bar{left:50%;right:auto;transform:translateX(-50%);width:min(780px,calc(100% - 24px))}
#opts{display:none;gap:12px;flex-wrap:wrap;align-items:center}
#bar.open #opts{display:flex}
#gear{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#e5e7eb;cursor:pointer}
#gear:hover,#bar.open #gear{background:var(--acc);color:#1a0d00}
#hd{transform:translateX(-50%)}
.recBtn{border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.06);color:#e5e7eb;padding:7px 10px;font:700 10px Inter;cursor:pointer}
.recBtn:hover:not(:disabled){border-color:var(--acc);background:rgba(255,138,31,.14)}
.recBtn:disabled{opacity:.35;cursor:not-allowed}
#recStart i{color:#fb7185}
#recStatus{font-size:10px;color:var(--acc2)}
#cgrab{display:flex;justify-content:space-between;align-items:center;cursor:grab;margin:-16px -16px 10px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);touch-action:none;user-select:none}
#cgrab:active{cursor:grabbing}
#cgrab button{background:0;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:2px 7px}
#cgrab button:hover{color:#fff}
#cgrab #cardx{position:static}
#card.min #info{display:none}
#helpt{white-space:nowrap}
@media(max-width:1100px){#helpt{display:none}}
</style>
</head>
<body>
<header>
 <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Globe</a>
 <div class="title">EARTH JUKEBOX <span>HD</span></div>
 <div id="helpt" class="lbl">Drag = move map · Scroll or double-click = zoom · Right-drag = tilt</div>
 <div class="srch"><i class="fa-solid fa-magnifying-glass s"></i><input id="cs" type="text" placeholder="Search a country…" autocomplete="off"><button id="cx" title="Clear country">✕</button><div id="cres"></div></div>
</header>
<div id="mapWrap"><div id="globeViz"></div>
 <button id="evb" class="fl"><i class="fa-solid fa-list"></i> Events <span id="evn" class="mono" style="color:var(--mut)"></span></button>
 <aside id="side" class="fl">
  <div class="sh"><b>Events <span id="count" class="mono" style="color:var(--mut);font-size:12px">0</span></b><button id="sidex" title="Hide list">✕</button></div>
  <div class="sp1"><input id="search" type="search" placeholder="Search events…"></div>
  <div id="legend"></div>
  <div id="list"></div>
 </aside>
 <div id="zc" class="fl">
  <button id="zin" title="Zoom in (+)"><i class="fa-solid fa-plus"></i></button>
  <button id="zout" title="Zoom out (−)"><i class="fa-solid fa-minus"></i></button>
  <button id="zhome" title="Reset view"><i class="fa-solid fa-expand"></i></button><hr>
  <button id="z3" title="Switch between tilted 3D and flat 2D view">2D</button>
  <button id="zsat" title="Change map: satellite / live satellite / dark"><i class="fa-solid fa-layer-group"></i></button>
  <button id="zlab" title="Show / hide country names"><i class="fa-solid fa-tag"></i></button>
  <button id="zpan" title="Show / hide event list"><i class="fa-solid fa-table-columns"></i></button>
 </div>
 <div id="hd" class="fl">Loading map…</div>
 <div id="card" class="fl"><div id="cgrab"><span><i class="fa-solid fa-grip"></i> Drag to move</span><span><button id="cdock" title="Reset position"><i class="fa-solid fa-arrows-rotate"></i></button><button id="cmin" title="Collapse / expand">−</button><button id="cardx" title="Close">✕</button></span></div><div id="info"></div></div>
 <section id="bar" class="fl">
  <div class="ra">
   <button id="play" disabled aria-label="Play or pause timeline" title="Play / pause timeline"><i id="pi" class="fa-solid fa-play" style="margin-left:3px"></i></button>
   <div style="min-width:0;flex:1">
    <div id="date" style="font-size:16px;font-weight:700">Loading EONET…</div>
    <div id="now" class="mono" style="font-size:11px;color:var(--acc2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">&nbsp;</div>
   </div>
   <span id="cnt" class="mono" style="font-size:10px;color:var(--mut)"></span>
   <button id="gear" title="Playback options"><i class="fa-solid fa-sliders"></i></button>
  </div>
  <div id="opts">
   <div class="seg"><button id="mDate" class="on"><i class="fa-regular fa-calendar"></i> By date</button><button id="mSweep"><i class="fa-solid fa-arrows-left-right"></i> Sweep W → E</button></div>
   <select id="days"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option></select>
   <div style="display:flex;align-items:center;gap:8px"><span class="lbl">Speed <span id="spInfo" style="text-transform:none;letter-spacing:0">· 25s</span></span>
    <div class="sp" id="sp"><button data-s=".25">.25×</button><button data-s=".5">.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div></div>
  </div>
  <div class="ra" id="recordControls" style="gap:7px;flex-wrap:wrap">
   <span class="lbl">Audio capture</span>
   <button id="recStart" class="recBtn"><i class="fa-solid fa-circle"></i> Record</button>
   <button id="recPause" class="recBtn" disabled><i class="fa-solid fa-pause"></i> Pause</button>
   <button id="recStop" class="recBtn" disabled><i class="fa-solid fa-stop"></i> Stop & Download</button>
   <span id="recStatus" class="mono" aria-live="polite">Ready · captures Jukebox audio only</span>
  </div>
  <div class="ra" style="gap:10px;font-size:10px;color:var(--mut)"><span id="t0" class="mono">--</span><div class="tw"><div class="track"><div id="prog"></div></div><input type="range" id="slider" min="0" max="1000" value="0" disabled></div><span id="t1" class="mono">--</span></div>
 </section>
</div>
<div id="tt" class="tip" style="position:fixed;display:none;z-index:50;pointer-events:none"></div>

<script>
