<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NASA EIC | Earth Jukebox (2D)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; background: #000; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        .interactive { pointer-events: auto; }
        .leaflet-control-attribution { background: rgba(0,0,0,0.7) !important; color: #aaa !important; }
        .leaflet-control-attribution a { color: #60a5fa !important; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #60a5fa; cursor: pointer; box-shadow: 0 0 10px rgba(96, 165, 250, 0.8); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; }

        .ping-container { position: relative; width: 0; height: 0; }
        .ping-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; animation: expand-fade 2s cubic-bezier(0.215, 0.61, 0.355, 1) forwards; }
        @keyframes expand-fade {
            0% { width: 0px; height: 0px; opacity: 1; border: 3px solid; box-shadow: inset 0 0 10px currentColor, 0 0 10px currentColor; }
            100% { width: 120px; height: 120px; opacity: 0; border: 1px solid; }
        }
        select { color-scheme: dark; }
        .evt-row { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid rgba(255,255,255,.06); transition:background .12s ease; }
        .evt-row:hover { background:rgba(255,255,255,.06); }
        .evt-row.sel { background:rgba(124,58,237,.22); box-shadow:inset 3px 0 0 #a78bfa; }
        .evt-play { flex-shrink:0; width:28px; height:28px; border-radius:999px; background:rgba(124,58,237,.85); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; transition:all .12s ease; cursor:pointer; }
        .evt-play:hover { background:#8b5cf6; transform:scale(1.12); }
        .evt-play:active { transform:scale(.94); }
        .mode-btn { padding:.35rem .7rem; background:rgba(255,255,255,.05); color:#cbd5e1; font-size:11px; font-weight:700; transition:all .15s ease; cursor:pointer; }
        .mode-btn:hover { background:rgba(255,255,255,.14); }
        .mode-btn.active { background:#7c3aed; color:#fff; box-shadow:0 0 12px rgba(124,58,237,.6); }
        .speed-btn { padding:.3rem .55rem; border-radius:.5rem; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#cbd5e1; font-size:11px; font-weight:700; font-family:monospace; transition:all .15s ease; cursor:pointer; }
        .speed-btn:hover { background:rgba(255,255,255,.14); }
        .speed-btn.active { background:#2563eb; border-color:#60a5fa; color:#fff; box-shadow:0 0 12px rgba(37,99,235,.6); }
        .info-row { display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:12px; }
        .info-row dt { color:#94a3b8; flex-shrink:0; }
        .info-row dd { color:#f1f5f9; text-align:right; margin:0; }
        .info-about { font-size:12px; line-height:1.55; color:#cbd5e1; }
        .legend-chip { display:flex; align-items:center; gap:.5rem; padding:.35rem .8rem; border-radius:999px; border:1px solid rgba(255,255,255,.12);
                       background:rgba(255,255,255,.04); color:#cbd5e1; cursor:pointer; transition:all .15s ease; font:inherit; letter-spacing:inherit; text-transform:inherit; }
        .legend-chip:hover:not(:disabled) { background:rgba(255,255,255,.12); transform:translateY(-1px); }
        .legend-chip.active { background:rgba(255,255,255,.16); border-color:var(--c,#fff); box-shadow:0 0 14px var(--c,#fff); color:#fff; }
        .legend-chip:disabled { opacity:.35; cursor:not-allowed; }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">

    <div id="map"></div>

    <div class="ui-layer flex flex-col h-screen justify-between">

        <nav class="glass-panel interactive w-full flex justify-between items-center px-8 py-4 border-b-0 shadow-lg flex-wrap gap-3">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-gray-400 hover:text-white transition mr-2 flex items-center gap-2 text-sm font-bold uppercase tracking-wider">
                    <i class="fa-solid fa-arrow-left"></i> Back to Globe
                </a>
                <div class="h-6 w-px bg-white/20"></div>
                <div class="flex items-center gap-3">
                    <div class="h-8 w-8 rounded bg-purple-500/20 flex items-center justify-center text-purple-400 border border-purple-500/50">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg tracking-wider text-white hidden md:block">EARTH JUKEBOX</span>
                        <span class="text-[10px] text-purple-300 tracking-widest uppercase">Translating Sight into Sound</span>
                    </div>
                </div>
            </div>
            <div id="legend" class="flex flex-wrap gap-4 text-[10px] md:text-xs font-mono uppercase tracking-widest"></div>
        </nav>

        <!-- Event details panel -->
        <div class="flex-1 min-h-0 px-4 pt-4 pb-2 flex flex-col sm:flex-row items-start justify-between gap-3">
            <div id="infoPanel" class="interactive glass-panel rounded-2xl w-full max-w-sm flex flex-col max-h-full overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 gap-2">
                    <button id="infoToggle" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-purple-300 hover:text-white transition">
                        <i class="fa-solid fa-circle-info"></i> Event details
                        <i id="infoChevron" class="fa-solid fa-chevron-up text-[10px] text-gray-500"></i>
                    </button>
                    <button id="followBtn" class="hidden text-[10px] font-bold uppercase tracking-wider bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded transition">Follow playback</button>
                </div>
                <div id="infoBody" class="overflow-y-auto px-4 py-3"></div>
            </div>

            <!-- Every event, each with its own play button -->
            <div id="listPanel" class="interactive glass-panel rounded-2xl w-full max-w-xs flex flex-col max-h-full overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
                    <button id="listToggle" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-purple-300 hover:text-white transition">
                        <i class="fa-solid fa-list"></i> All events <span id="listCount" class="text-gray-400 font-mono">0</span>
                        <i id="listChevron" class="fa-solid fa-chevron-up text-[10px] text-gray-500"></i>
                    </button>
                </div>
                <div id="listBody" class="flex flex-col min-h-0">
                    <input id="listSearch" type="search" placeholder="Search events…" class="mx-3 my-2 bg-slate-800 text-xs px-3 py-2 rounded border border-slate-600 focus:outline-none focus:border-purple-400 text-white placeholder-gray-500">
                    <div id="eventList" class="overflow-y-auto" style="max-height:42vh"></div>
                </div>
            </div>
        </div>

        <div class="interactive flex justify-center mb-10 w-full px-4">
            <div class="glass-panel w-full max-w-4xl p-6 rounded-2xl flex flex-col gap-5 shadow-2xl">

                <div class="flex justify-between items-end gap-4">
                    <div class="min-w-0">
                        <h2 class="text-2xl font-bold text-white mb-1" id="displayDate">Loading EONET Data...</h2>
                        <p class="text-xs text-gray-400 uppercase tracking-widest" id="subtitle">NASA EONET natural events — real data</p>
                        <p class="text-xs text-blue-300 mt-2 font-mono truncate" id="nowPlaying">&nbsp;</p>
                        <div class="flex items-center gap-3 mt-3 flex-wrap">
                            <div class="flex rounded-lg overflow-hidden border border-white/15">
                                <button id="modeDate" class="mode-btn active"><i class="fa-regular fa-calendar mr-1"></i>By date</button>
                                <button id="modeSweep" class="mode-btn"><i class="fa-solid fa-arrows-left-right mr-1"></i>Sweep west → east</button>
                            </div>
                            <label class="text-[10px] uppercase tracking-wider text-gray-400 flex items-center gap-1 cursor-pointer" title="When the by-date run finishes, automatically play the left-to-right sweep">
                                <input type="checkbox" id="autoSweep" checked class="accent-purple-500"> then sweep
                            </label>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div>
                            <label class="text-[10px] uppercase tracking-widest text-gray-400 font-bold block mb-1">Speed <span id="speedInfo" class="text-gray-500 normal-case tracking-normal">· 25s</span></label>
                            <div id="speedGroup" class="flex gap-1">
                                <button class="speed-btn" data-speed="0.25">0.25×</button>
                                <button class="speed-btn" data-speed="0.5">0.5×</button>
                                <button class="speed-btn active" data-speed="1">1×</button>
                                <button class="speed-btn" data-speed="2">2×</button>
                                <button class="speed-btn" data-speed="4">4×</button>
                            </div>
                        </div>
                        <div class="hidden sm:block">
                            <label class="text-[10px] uppercase tracking-widest text-gray-400 font-bold block mb-1">Time window</label>
                            <select id="daysSelect" class="bg-slate-800 text-xs p-2 rounded border border-slate-600 text-white">
                                <option value="7">Last 7 days</option>
                                <option value="14" selected>Last 14 days</option>
                                <option value="30">Last 30 days</option>
                            </select>
                        </div>
                        <button id="playBtn" disabled class="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-full w-16 h-16 flex items-center justify-center text-2xl transition shadow-[0_0_20px_rgba(37,99,235,0.4)]">
                            <i class="fa-solid fa-play ml-1" id="playIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="relative w-full">
                    <input type="range" id="timeSlider" min="0" max="1000" value="0" class="w-full absolute top-0 left-0 z-20 opacity-0 cursor-pointer" disabled>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden relative z-10 pointer-events-none">
                        <div id="progressBar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-blue-500 to-purple-500 w-0"></div>
                    </div>
                </div>

                <div class="flex justify-between text-[10px] font-bold text-gray-500 uppercase tracking-widest font-mono">
                    <span id="startDateLabel">--</span>
                    <span id="countLabel" class="text-gray-400"></span>
                    <span id="endDateLabel">--</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    /* =====================================================================
       REAL DATA: NASA EONET v3 (Earth Observatory Natural Event Tracker)
       Every dot, ping and sound below is a real, dated, geolocated event.
       Mapping:
         latitude   -> pitch (pentatonic scale, north = higher)
         longitude  -> stereo pan (west = left, east = right)
         category   -> instrument
         time       -> playback position (the window is compressed to ~25 s)
       ===================================================================== */

    const CATS = {
        wildfires:    { label: 'Wildfires',  color: '#ef4444' },
        severeStorms: { label: 'Storms',     color: '#3b82f6' },
        volcanoes:    { label: 'Volcanoes',  color: '#f97316' },
        floods:       { label: 'Floods',     color: '#6366f1' },
        landslides:   { label: 'Landslides', color: '#a16207' }
    };

    /* ---------- Map ---------- */
    const map = L.map('map', { zoomControl: false, maxBounds: [[-90, -180], [90, 180]], maxBoundsViscosity: 1.0, worldCopyJump: false, minZoom: 2 }).setView([20, 0], 3);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri | Events: NASA EONET', maxZoom: 10, noWrap: true
    }).addTo(map);

    /* ---------- Audio ---------- */
    const master = new Tone.Gain(1).toDestination();          // used to fade a whole event in and out
    const panner = new Tone.Panner(0).connect(master);

    // Start / end cues: bypass the fade so they stay audible. Start = left ear, rising. End = right ear, falling.
    const cuePanner = new Tone.Panner(0).toDestination();
    const cueSynth = new Tone.Synth({
        oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.25, sustain: 0, release: 0.2 }, volume: -10
    }).connect(cuePanner);

    // Continuous "bed" that lasts the whole life of an event (timbre depends on its type)
    const BED = {
        wildfires:    { noise: 'brown', ftype: 'lowpass',  freq: 450,  vol: -22 },
        severeStorms: { noise: 'pink',  ftype: 'bandpass', freq: 700,  vol: -24 },
        volcanoes:    { noise: 'brown', ftype: 'lowpass',  freq: 140,  vol: -14 },
        floods:       { noise: 'pink',  ftype: 'bandpass', freq: 1400, vol: -26 },
        landslides:   { noise: 'brown', ftype: 'lowpass',  freq: 260,  vol: -18 }
    };
    const bedNoise = new Tone.Noise('brown');
    const bedFilter = new Tone.Filter({ type: 'lowpass', frequency: 450 });
    bedNoise.chain(bedFilter, panner);

    // Wildfire: crackling pops + a low flame roar
    const crackleFilter = new Tone.Filter({ type: 'bandpass', frequency: 3500, Q: 0.8 }).connect(panner);
    const crackleSynth = new Tone.NoiseSynth({
        noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.035, sustain: 0, release: 0.01 }, volume: -6
    }).connect(crackleFilter);
    const flameFilter = new Tone.Filter({ type: 'lowpass', frequency: 500 }).connect(panner);
    const flameSynth = new Tone.NoiseSynth({
        noise: { type: 'brown' }, envelope: { attack: 0.06, decay: 0.2, sustain: 0.35, release: 0.25 }, volume: -14
    }).connect(flameFilter);

    // Storm: wind whoosh + water drops
    const windFilter = new Tone.Filter({ type: 'bandpass', frequency: 500, Q: 1.2 }).connect(panner);
    const windSynth = new Tone.NoiseSynth({
        noise: { type: 'pink' }, envelope: { attack: 0.35, decay: 0.7, sustain: 0, release: 0.4 }, volume: -9
    }).connect(windFilter);
    const dropEcho = new Tone.FeedbackDelay({ delayTime: 0.18, feedback: 0.3, wet: 0.25 }).connect(panner);
    const dropSynth = new Tone.MembraneSynth({
        pitchDecay: 0.04, octaves: 2.5, oscillator: { type: 'sine' },
        envelope: { attack: 0.001, decay: 0.16, sustain: 0, release: 0.05 }, volume: -8
    }).connect(dropEcho);

    const volcanoSynth = new Tone.MembraneSynth({
        pitchDecay: 0.05, octaves: 4, envelope: { attack: 0.01, decay: 0.5, sustain: 0.01, release: 1.5 }, volume: -6
    }).connect(panner);
    const floodSynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'sine' }, envelope: { attack: 0.02, decay: 0.3, sustain: 0.1, release: 0.9 }, volume: -10
    }).connect(panner);
    const slideFilter = new Tone.Filter({ type: 'lowpass', frequency: 500 }).connect(panner);
    const slideSynth = new Tone.NoiseSynth({
        noise: { type: 'brown' }, envelope: { attack: 0.1, decay: 0.5, sustain: 0.4, release: 0.4 }, volume: -8
    }).connect(slideFilter);

    // A short 3-note "signature" motif per event, in a timbre/octave that matches its type
    const MOTIF = {
        wildfires:    { type: 'sawtooth', oct: [4, 5], vol: -20 },
        severeStorms: { type: 'sine',     oct: [5, 6], vol: -16 },
        volcanoes:    { type: 'square',   oct: [2, 3], vol: -22 },
        floods:       { type: 'triangle', oct: [3, 4], vol: -16 },
        landslides:   { type: 'sawtooth', oct: [2, 3], vol: -22 }
    };
    const PENTA = ['C', 'D', 'E', 'G', 'A'];
    const motifSynths = {};
    Object.entries(MOTIF).forEach(([cat, m]) => {
        motifSynths[cat] = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: m.type }, envelope: { attack: 0.005, decay: 0.12, sustain: 0.05, release: 0.25 }, volume: m.vol
        }).connect(panner);
    });

    const SCALE_LO = ['C1','D1','E1','G1','A1','C2','D2','E2'];
    const SCALE_MID = ['C3','D3','E3','G3','A3','C4','D4','E4'];
    const SCALE_DROP = ['E5','G5','A5','C6','D6','E6','G6'];
    const noteFor = (scale, lat) => scale[Math.min(scale.length - 1, Math.max(0, Math.floor((lat + 90) / 180 * scale.length)))];

    // Each monophonic synth needs strictly increasing start times
    const lastSlot = {};
    function slot(key, t) {                          // returns null when that synth is already booked too far ahead
        const cand = Math.max(t, (lastSlot[key] || 0) + 0.008);
        if (cand - Tone.now() > 0.6) return null;
        lastSlot[key] = cand;
        return cand;
    }
    let lastBase = 0;

    // ---- Every event gets its own sound signature, derived from its own data ----
    // A seeded random generator (seeded by the event's id + report number + time) means
    // the same event ALWAYS sounds the same, and different events sound different.
    function hashStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function mulberry32(a) {
        return function () {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    const pick = (R, arr) => arr[Math.floor(R() * arr.length)];
    const arr8 = fn => Array.from({ length: 8 }, fn);

    function baseParams(e, R) {
        const known = e.mag != null && !isNaN(e.mag);
        switch (e.cat) {
            case 'wildfires': {
                const acres = known && /^acres?$/i.test(e.magUnit || '') ? e.mag : null;
                const size = acres != null ? Math.min(1, Math.log10(acres + 1) / 5) : 0.2 + R() * 0.5;   // bigger fire = bigger sound
                return {
                    size, bright: (1500 + (e.lat + 90) / 180 * 3000) * (0.75 + R() * 0.5),
                    pops: 3 + Math.floor(R() * 5), offsets: arr8(() => R() * 0.2), jit: arr8(() => 0.7 + R() * 0.7),
                    lens: arr8(() => R() * 0.03), vel: arr8(() => 0.5 + R() * 0.5),
                    roar: 0.2 + size * 0.7, roarFreq: 700 - size * 450 + R() * 150
                };
            }
            case 'severeStorms': {
                const kt = known && /^kts?$/i.test(e.magUnit || '') ? e.mag : 30 + R() * 60;
                const drops = 2 + Math.floor(R() * 3);
                return {
                    kt, f: (300 + Math.min(kt, 140) / 140 * 700) * (0.9 + R() * 0.2), q: 0.8 + R() * 2.2,
                    drops, notes: Array.from({ length: drops }, () => pick(R, SCALE_DROP)), gaps: arr8(() => 0.1 + R() * 0.25)
                };
            }
            case 'volcanoes': {
                const base = Math.floor((e.lat + 90) / 180 * SCALE_LO.length);
                return { note: SCALE_LO[(base + Math.floor(R() * 3)) % SCALE_LO.length], dur: 0.4 + R() * 1.0 };
            }
            case 'floods':
                return { notes: Array.from({ length: 3 }, () => pick(R, SCALE_MID)), gap: 0.09 + R() * 0.12 };
            case 'landslides':
                return { dur: 0.25 + R() * 0.6, freq: 200 + R() * 700 };
        }
        return {};
    }

    function soundParams(e) {
        const R = mulberry32(hashStr(`${e.id}|${e.idx}|${e.date}`));
        const p = baseParams(e, R);
        const m = MOTIF[e.cat];
        p.motif = Array.from({ length: 3 }, () => pick(R, PENTA) + (m.oct[0] + Math.floor(R() * (m.oct[1] - m.oct[0] + 1))));
        p.mgap = 0.07 + R() * 0.09;
        return p;
    }

    function describeSound(e) {
        const p = soundParams(e);
        return describeBase(e, p) + ` · signature ${p.motif.join(' ')}`;
    }
    function describeBase(e, p) {
        switch (e.cat) {
            case 'wildfires':    return `${p.pops} crackles · ${p.roar.toFixed(1)} s roar · ${Math.round(p.bright)} Hz brightness`;
            case 'severeStorms': return `wind ${Math.round(p.f)} Hz · ${p.drops} drops (${p.notes.join(' ')})`;
            case 'volcanoes':    return `${p.note} boom · ${p.dur.toFixed(1)} s`;
            case 'floods':       return `${p.notes.join(' → ')} ripple`;
            case 'landslides':   return `${p.dur.toFixed(1)} s rumble · ${Math.round(p.freq)} Hz`;
        }
        return '';
    }

    function playEvent(evt, gain = 1, opts = {}) {
        try { scheduleSound(evt, gain, !!opts.light, !!opts.noPan); }
        catch (err) { console.warn('sound skipped:', err); }       // a sound error must never stop the animation loop
    }

    function scheduleSound(evt, gain, light, noPan) {
        const now = Tone.now();
        const t0 = Math.max(now + 0.03, lastBase + 0.004);
        if (t0 - now > 1.0) return;                  // overloaded: skip this one (and do NOT push the clock further)
        lastBase = t0;
        if (!noPan) panner.pan.setValueAtTime(Math.max(-1, Math.min(1, evt.lng / 180)), t0);
        const v = Math.max(0.03, Math.min(1, gain));
        const p = soundParams(evt);
        switch (evt.cat) {
            case 'wildfires': {
                const pops = light ? Math.min(p.pops, 2) : p.pops;
                for (let i = 0; i < pops; i++) {
                    const t = slot('crackle', t0 + p.offsets[i]);
                    if (t === null) break;
                    crackleFilter.frequency.setValueAtTime(p.bright * p.jit[i], t);
                    crackleSynth.triggerAttackRelease(0.015 + p.lens[i], t, v * p.vel[i]);
                }
                const tf = slot('flame', t0);
                if (tf !== null) {
                    flameFilter.frequency.setValueAtTime(p.roarFreq, tf);
                    flameSynth.triggerAttackRelease(p.roar, tf, v * (0.5 + 0.5 * p.size));
                }
                break;
            }
            case 'severeStorms': {
                const t = slot('wind', t0);
                if (t !== null) {
                    windFilter.frequency.setValueAtTime(p.f * 0.6, t);
                    windFilter.frequency.exponentialRampToValueAtTime(p.f * 1.4, t + 0.7);
                    windFilter.Q.setValueAtTime(p.q, t);
                    windSynth.triggerAttackRelease(0.5, t, v * (0.6 + 0.4 * Math.min(p.kt, 140) / 140));
                }
                let dt = 0.1;
                const nDrops = light ? 1 : p.drops;
                for (let i = 0; i < nDrops; i++) {
                    dt += p.gaps[i];
                    const td = slot('drop', t0 + dt);
                    if (td === null) break;
                    dropSynth.triggerAttackRelease(p.notes[i], 0.1, td, v * 0.8);
                }
                break;
            }
            case 'volcanoes': {
                const t = slot('volc', t0);
                if (t !== null) volcanoSynth.triggerAttackRelease(p.note, p.dur, t, v);
                break;
            }
            case 'floods': {
                const n = light ? 2 : 3;
                for (let i = 0; i < n; i++) floodSynth.triggerAttackRelease(p.notes[i], '16n', t0 + i * p.gap, v);
                break;
            }
            case 'landslides': {
                const ts = slot('slide', t0);
                if (ts !== null) {
                    slideFilter.frequency.setValueAtTime(p.freq, ts);
                    slideSynth.triggerAttackRelease(p.dur, ts, v);
                }
                break;
            }
        }
        if (!light || v > 0.55) {                    // signature motif (in the sweep only for the closest events)
            const ms = motifSynths[evt.cat], n = light ? 2 : 3;
            for (let i = 0; i < n; i++) ms.triggerAttackRelease(p.motif[i], 0.09, t0 + 0.05 + i * p.mgap, v * 0.7);
        }
    }

    /* ---------- Data ---------- */
    let allEvents = [];      // every real event in the window
    let events = [];         // events for the selected category (what plays)
    let activeCat = 'all';
    let speed = 1;
    let pinned = false;
    let selectedEvt = null;
    const trail = L.layerGroup().addTo(map);     // dots left behind by events that already played
    let mode = 'date';                           // 'date' = day by day, 'sweep' = whole window, west -> east
    let autoSweep = true;
    let nextSoundTick = 0;
    let story = null;                    // the event currently being played start -> end
    let stories = new Map();             // event id -> { reports[], start, end, ... }
    const storyLayer = L.layerGroup().addTo(map);
    let listOrder = [], rowEls = new Map(), lastRowEl = null;
    const sweepLayer = L.layerGroup().addTo(map);
    let sweepLine = null, sweepBand = null, sweepDots = [];
    const SWEEP_MS = 30000;                      // one full west -> east pass at 1x
    const PROX_DEG = 18;                         // events within this many degrees of the line are audible
    let timeRange = { start: 0, end: 0, duration: 0 };
    const PROXY = 'https://api.allorigins.win/raw?url=';
    const $ = id => document.getElementById(id);

    async function fetchJson(url) {
        const attempt = async (u) => {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 25000);
            try { const r = await fetch(u, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
            finally { clearTimeout(timer); }
        };
        try { return await attempt(url); }
        catch (e) { console.warn('Direct fetch failed, trying proxy…', e); return await attempt(PROXY + encodeURIComponent(url)); }
    }

    async function loadEonetData() {
        const days = $('daysSelect').value;
        $('playBtn').disabled = true; $('timeSlider').disabled = true;
        stopPlayback();
        $('displayDate').innerText = 'Connecting to NASA EONET…';
        $('subtitle').innerText = `Live ${days}-day natural event sonification`;
        try {
            const url = `https://eonet.gsfc.nasa.gov/api/v3/events?status=all&days=${days}&category=${Object.keys(CATS).join(',')}`;
            const data = await fetchJson(url);
            processEvents(data.events || []);
        } catch (err) {
            console.error('EONET unavailable', err);
            $('displayDate').innerText = 'Could not reach NASA EONET';
            $('subtitle').innerText = 'Serve this page over http:// (e.g. python -m http.server) and check your connection, then pick a time window to retry.';
        }
    }

    function processEvents(apiEvents) {
        allEvents = [];
        const cutoff = Date.now() - parseInt($('daysSelect').value, 10) * 86400000;
        apiEvents.forEach(evt => {
            const cat = evt.categories?.[0]?.id;
            if (!CATS[cat]) return;
            const pts = (evt.geometry || evt.geometries || []).filter(g => g.type === 'Point');
            pts.forEach((geo, i) => {
                const date = new Date(geo.date).getTime();
                if (date < cutoff) return;                     // only observations inside the window
                allEvents.push({
                    id: evt.id, title: evt.title, description: evt.description, link: evt.link,
                    closed: evt.closed, sources: evt.sources || [], idx: i + 1, total: pts.length,
                    cat, color: CATS[cat].color,
                    lat: geo.coordinates[1], lng: geo.coordinates[0],
                    date, mag: geo.magnitudeValue, magUnit: geo.magnitudeUnit, triggered: false
                });
            });
        });
        allEvents.sort((a, b) => a.date - b.date);
        if (activeCat !== 'all' && !allEvents.some(e => e.cat === activeCat)) activeCat = 'all';
        applyFilter();
    }

    // Show / play only the chosen category (or everything), in the current mode
    function applyFilter() {
        stopStory();
        stopPlayback();
        events = allEvents.filter(e => activeCat === 'all' || e.cat === activeCat).map(e => ({ ...e, triggered: false, _next: 0 }));
        playProgress = 0;
        trail.clearLayers(); sweepLayer.clearLayers(); sweepDots = []; sweepLine = sweepBand = null;
        pinned = false; selectedEvt = null; showPlaceholder();
        buildStories();
        buildLegend();
        renderList();
        $('nowPlaying').innerHTML = '&nbsp;';
        updateSpeedInfo();
        const label = activeCat === 'all' ? 'events' : CATS[activeCat].label.toLowerCase();
        if (events.length >= 1) {
            $('playBtn').disabled = false;
            $('timeSlider').disabled = false;
            if (mode === 'sweep') {
                setupSweep(label);
            } else {
                const days = parseInt($('daysSelect').value, 10);
                const d0 = new Date(Date.now() - (days - 1) * 86400000); d0.setHours(0, 0, 0, 0);   // start of day 1
                timeRange.start = d0.getTime();
                timeRange.end = Math.max(Date.now(), events[events.length - 1].date);                // through today
                timeRange.duration = Math.max(1, timeRange.end - timeRange.start);
                timeRange.days = Math.max(1, Math.ceil(timeRange.duration / 86400000));
                $('startDateLabel').innerText = new Date(timeRange.start).toLocaleDateString();
                $('endDateLabel').innerText = new Date(timeRange.end).toLocaleDateString();
                $('countLabel').innerText = `${events.length.toLocaleString()} real ${label}`;
            }
            updateUI();
        } else {
            $('displayDate').innerText = 'No events found for this window';
            $('startDateLabel').innerText = '--'; $('endDateLabel').innerText = '--'; $('countLabel').innerText = '';
            $('playBtn').disabled = true; $('timeSlider').disabled = true;
            $('progressBar').style.width = '0%';
        }
    }

    function setMode(m) {
        mode = m;
        $('modeDate').classList.toggle('active', m === 'date');
        $('modeSweep').classList.toggle('active', m === 'sweep');
        applyFilter();
    }

    /* ---------- Sweep mode: the whole window at once, west -> east ---------- */
    function setupSweep(label) {
        $('startDateLabel').innerText = '180° W';
        $('endDateLabel').innerText = '180° E';
        $('countLabel').innerText = `${events.length.toLocaleString()} ${label} · whole window together`;
        sweepBand = L.rectangle([[-85, -180 - PROX_DEG], [85, -180 + PROX_DEG]], { color: '#60a5fa', weight: 0, fillColor: '#60a5fa', fillOpacity: 0.07, interactive: false }).addTo(sweepLayer);
        sweepLine = L.polyline([[-85, -180], [85, -180]], { color: '#93c5fd', weight: 2, opacity: 0.95, interactive: false }).addTo(sweepLayer);
        events.forEach(e => {
            const m = L.circleMarker([e.lat, e.lng], { radius: 3, color: '#fff', weight: 0.5, opacity: 0.3, fillColor: e.color, fillOpacity: 0.3 }).addTo(sweepLayer);
            m._e = e; m._b = -1;
            m.bindTooltip(esc(e.title) + ' — click to hear it', { direction: 'top' });
            m.on('click', () => pickEvent(e));
            sweepDots.push(m);
        });
    }

    // Loudness follows proximity: louder as the line approaches an event, quieter once it has passed
    function renderSweepFrame(sound) {
        if (!sweepLine) return;
        const lng = -180 + 360 * playProgress;
        sweepLine.setLatLngs([[-85, lng], [85, lng]]);
        sweepBand.setBounds([[-85, lng - PROX_DEG], [85, lng + PROX_DEG]]);
        const nowMs = performance.now();
        const tickNow = sound && nowMs >= nextSoundTick;
        if (tickNow) nextSoundTick = nowMs + 110;                // sound is scheduled ~9x per second, not every frame
        const cands = [];
        let nearest = null, nd = Infinity;
        for (const m of sweepDots) {
            const e = m._e, d = Math.abs(e.lng - lng);
            const prox = d < PROX_DEG ? 1 - d / PROX_DEG : 0;
            const b = Math.round(prox * 6);
            if (b !== m._b) {                                   // visual glow follows proximity too
                m._b = b;
                const p = b / 6;
                m.setStyle({ fillOpacity: 0.3 + 0.7 * p, opacity: 0.3 + 0.7 * p, weight: 0.5 + 1.5 * p });
                m.setRadius(3 + 8 * p);
            }
            if (d < nd) { nd = d; nearest = e; }
            if (tickNow && prox > 0 && nowMs >= e._next) cands.push({ e, prox });
        }
        // voice budget: only the closest few events sound each tick -> never overloads, nothing goes missing
        cands.sort((a, b) => b.prox - a.prox);
        cands.slice(0, 4).forEach(({ e, prox }) => {
            e._next = nowMs + 800 - 500 * prox;                  // closer = faster repeats
            playEvent(e, Math.pow(prox, 1.4) * 0.95, { light: true });   // closer = louder, farther = quieter
        });
        if (nearest && nd < PROX_DEG && nearest !== selectedEvt) {
            if (!pinned) selectEvent(nearest);
            $('nowPlaying').textContent = `♪ ${CATS[nearest.cat].label}: ${nearest.title}`;
        }
    }

    function buildLegend() {
        const chip = (id, label, color, n) => {
            const on = activeCat === id;
            return `<button data-cat="${id}" ${n === 0 ? 'disabled' : ''} class="legend-chip ${on ? 'active' : ''}" style="--c:${color}" title="${n === 0 ? 'No events in this window' : 'Show only ' + label}">
                <span class="w-2 h-2 md:w-3 md:h-3 rounded-full" style="background:${color};box-shadow:0 0 8px ${color}"></span>${label} <span class="${on ? 'text-white' : 'text-gray-500'}">${n}</span></button>`;
        };
        const all = chip('all', 'All', '#a78bfa', allEvents.length);
        const cats = Object.entries(CATS).map(([id, c]) => chip(id, c.label, c.color, allEvents.filter(e => e.cat === id).length)).join('');
        $('legend').innerHTML = all + cats;
    }

    /* ---------- Playback ---------- */
    let isPlaying = false, playProgress = 0, lastTime = 0;
    const PLAYBACK_MS = 25000;                   // by-date run at 1x

    function stopPlayback() {
        isPlaying = false;
        $('playIcon').classList.remove('fa-pause'); $('playIcon').classList.add('fa-play');
    }

    function startPlayback() {
        stopStory();
        isPlaying = true;
        $('playIcon').classList.add('fa-pause'); $('playIcon').classList.remove('fa-play');
    }

    function animateTimeline(now) {
        const dt = Math.min(100, now - lastTime);   // clamp so background tabs don't skip ahead
        lastTime = now;
        if (isPlaying) {
            playProgress += (dt * speed) / (mode === 'sweep' ? SWEEP_MS : PLAYBACK_MS);
            if (playProgress >= 1) {
                playProgress = 1; updateUI();
                if (mode === 'sweep') { renderSweepFrame(false); stopPlayback(); }
                else {
                    checkTriggers(); stopPlayback();
                    if (autoSweep && events.length) { setMode('sweep'); startPlayback(); }   // chain into the sweep
                }
            } else {
                updateUI();
                if (mode === 'sweep') renderSweepFrame(true); else checkTriggers();
            }
        }
        if (story) { try { updateStory(); } catch (err) { console.warn(err); stopStory(); } }
        requestAnimationFrame(animateTimeline);     // loop never dies
    }

    function updateUI() {
        $('timeSlider').value = playProgress * 1000;
        $('progressBar').style.width = `${playProgress * 100}%`;
        if (!events.length) return;
        if (mode === 'sweep') {
            const lng = -180 + 360 * playProgress;
            $('displayDate').innerText = `Sweeping ${Math.abs(lng).toFixed(0)}° ${lng < 0 ? 'W' : 'E'}`;
        } else {
            const ms = timeRange.start + timeRange.duration * playProgress;
            const dayNo = Math.min(timeRange.days, Math.floor((ms - timeRange.start) / 86400000) + 1);
            $('displayDate').innerText = `Day ${dayNo} of ${timeRange.days} · ` + new Date(ms).toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
        }
    }

    function checkTriggers() {
        const currentMs = timeRange.start + timeRange.duration * playProgress;
        let latest = null;
        for (const evt of events) {
            if (evt.date > currentMs) break;           // events are sorted
            if (evt.triggered) continue;
            evt.triggered = true;
            playEvent(evt);
            ping(evt);
            addDot(evt);
            latest = evt;
        }
        if (latest) {
            if (!pinned) selectEvent(latest);
            const mag = latest.mag != null ? ` · ${latest.mag} ${latest.magUnit || ''}` : '';
            $('nowPlaying').textContent = `♪ ${CATS[latest.cat].label}: ${latest.title}${mag}`;
        }
    }

    function ping(evt) {
        const html = `<div class="ping-container"><div class="ping-ring" style="color:${evt.color};border-color:${evt.color};"></div></div>`;
        const marker = L.marker([evt.lat, evt.lng], { icon: L.divIcon({ className: 'custom-ping', html, iconSize: [0, 0] }), interactive: false }).addTo(map);
        setTimeout(() => map.removeLayer(marker), 2000);
    }

    function resetRun() {
        playProgress = 0;
        events.forEach(e => { e.triggered = false; e._next = 0; });
        trail.clearLayers(); pinned = false; showPlaceholder();
        if (mode === 'sweep') renderSweepFrame(false);
    }

    $('playBtn').addEventListener('click', async () => {
        await Tone.start();
        if (!isPlaying && playProgress >= 0.99) resetRun();
        if (isPlaying) stopPlayback(); else startPlayback();
    });

    $('timeSlider').addEventListener('input', e => {
        playProgress = e.target.value / 1000;
        updateUI();
        if (mode === 'sweep') { renderSweepFrame(false); return; }     // scrubbing is silent
        const currentMs = timeRange.start + timeRange.duration * playProgress;
        events.forEach(evt => { evt.triggered = evt.date <= currentMs; });
        rebuildTrail();
    });

    /* ---------- Speed & mode ---------- */
    function updateSpeedInfo() {
        const total = (mode === 'sweep' ? SWEEP_MS : PLAYBACK_MS) / 1000;
        $('speedInfo').textContent = `· ${Math.round(total / speed)}s`;
    }
    document.querySelectorAll('.speed-btn').forEach(b => b.addEventListener('click', () => {
        speed = parseFloat(b.dataset.speed);
        document.querySelectorAll('.speed-btn').forEach(x => x.classList.toggle('active', x === b));
        updateSpeedInfo();
    }));
    $('modeDate').addEventListener('click', () => setMode('date'));
    $('modeSweep').addEventListener('click', () => setMode('sweep'));
    $('autoSweep').addEventListener('change', e => { autoSweep = e.target.checked; });

    /* ---------- Event details ---------- */
    const INFO = {
        wildfires: {
            name: 'Wildfire', icon: 'fa-fire',
            about: 'An uncontrolled fire in forest, grassland or scrub. Satellites such as NASA\'s MODIS and VIIRS spot fires by their heat, and smoke can drift thousands of kilometres, harming air quality far from the flames. Size is usually reported in acres or hectares.',
            sound: 'Crackling pops over a low flame roar. Higher latitude = brighter crackle.'
        },
        severeStorms: {
            name: 'Severe storm', icon: 'fa-hurricane',
            about: 'Mostly tropical cyclones (hurricanes, typhoons and cyclones): huge rotating storms that grow over warm ocean water. They are ranked by sustained wind speed in knots; from 64 kt a cyclone reaches hurricane/typhoon strength. Each dot is one position along the storm\'s track.',
            sound: 'A wind whoosh (stronger storm = higher whistle) with water-drop plinks.'
        },
        volcanoes: {
            name: 'Volcano', icon: 'fa-mountain',
            about: 'An opening in Earth\'s crust where molten rock, ash and gas escape. Eruptions can throw ash high into the atmosphere, disrupt air travel and even cool the climate for a while. Activity reports often come from the Smithsonian / USGS Global Volcanism Program.',
            sound: 'A deep boom. Higher latitude = slightly higher pitch.'
        },
        floods: {
            name: 'Flood', icon: 'fa-water',
            about: 'Water spilling over normally dry land after heavy rain, fast snowmelt, storm surge or a dam failure. Radar satellites can map flood extent even through cloud cover.',
            sound: 'A soft sine "water drop". Higher latitude = higher note.'
        },
        landslides: {
            name: 'Landslide', icon: 'fa-hill-rockslide',
            about: 'A slope of rock, soil or debris giving way, usually after intense rain or an earthquake. NASA maintains a Global Landslide Catalog built from news and agency reports.',
            sound: 'A low brown-noise rumble.'
        }
    };

    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function stormClass(kt) {                       // Saffir–Simpson scale (knots)
        if (kt < 34) return 'Tropical depression';
        if (kt < 64) return 'Tropical storm';
        if (kt < 83) return 'Category 1';
        if (kt < 96) return 'Category 2';
        if (kt < 113) return 'Category 3 (major)';
        if (kt < 137) return 'Category 4 (major)';
        return 'Category 5 (major)';
    }

    function magInfo(e) {
        if (e.mag == null) return null;
        const u = (e.magUnit || '').trim();
        const main = `${Number(e.mag).toLocaleString()} ${u}`.trim();
        let label = 'Magnitude', extra = '';
        if (/^kts?$/i.test(u)) {
            label = 'Wind speed';
            extra = `≈ ${Math.round(e.mag * 1.852)} km/h`;
            if (e.cat === 'severeStorms') extra += ` · ${stormClass(e.mag)}`;
        } else if (/^acres?$/i.test(u)) {
            label = 'Fire size';
            extra = `≈ ${Math.round(e.mag * 0.404686).toLocaleString()} hectares`;
        }
        return { label, main, extra };
    }

    const fmtDate = ms => new Date(ms).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    function renderDetails(e) {
        const info = INFO[e.cat], m = magInfo(e);
        const st = stories.get(e.id);
        const fd = ms => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const range = st ? `${fd(st.start)} → ${st.closed ? fd(st.end) : 'ongoing'} · ${st.reports.length} report${st.reports.length === 1 ? '' : 's'}` : '';
        const status = e.closed ? `Ended ${new Date(e.closed).toLocaleDateString()}` : 'Ongoing';
        const row = (k, v) => `<div class="info-row"><dt>${k}</dt><dd>${v}</dd></div>`;
        const links = (e.sources || []).filter(x => /^https?:\/\//.test(x.url || '')).slice(0, 3)
            .map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener" class="text-blue-300 hover:text-blue-200 underline">${esc(x.id || 'source')}</a>`).join(' · ');
        return `
            <div class="flex items-center gap-2 mb-2">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider" style="background:${e.color}33;color:${e.color};border:1px solid ${e.color}66"><i class="fa-solid ${info.icon} mr-1"></i>${info.name}</span>
                <span class="text-[10px] uppercase tracking-wider ${e.closed ? 'text-gray-400' : 'text-emerald-300'}">${status}</span>
            </div>
            <h3 class="text-base font-bold leading-snug mb-2">${esc(e.title)}</h3>
            ${e.description ? `<p class="text-xs text-gray-300 mb-2">${esc(e.description)}</p>` : ''}
            <dl class="mb-3">
                ${row('Observed', esc(fmtDate(e.date)))}
                ${row('Where', '<span id="geoText">…</span>')}
                ${row('Coordinates', `${e.lat.toFixed(2)}°, ${e.lng.toFixed(2)}°`)}
                ${m ? row(m.label, `${esc(m.main)}${m.extra ? `<br><span class="text-gray-400">${esc(m.extra)}</span>` : ''}`) : ''}
                ${e.total > 1 ? row('Track', `Report ${e.idx} of ${e.total}`) : ''}
                ${row('Its sound', esc(describeSound(e)))}
            </dl>
            <h4 class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">About ${info.name.toLowerCase()}s</h4>
            <p class="info-about mb-2">${info.about}</p>
            <p class="text-[11px] text-purple-300 mb-2"><i class="fa-solid fa-music mr-1"></i>${info.sound}</p>
            <p class="text-[11px] text-gray-400">${links ? 'Sources: ' + links + ' · ' : ''}${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener" class="text-blue-300 hover:text-blue-200 underline">NASA EONET record</a>` : ''}</p>
            ${st ? `<div class="mt-3 p-3 rounded-lg bg-white/5 border border-white/10">
                <div class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">Whole event</div>
                <div class="text-[11px] text-gray-300 mb-2">${range}</div>
                <button id="playStoryBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold py-2 rounded-lg transition"><i class="fa-solid fa-play mr-1"></i>Play event start → end</button>
                <div class="h-1.5 bg-white/10 rounded mt-2 overflow-hidden"><div id="storyBar" class="h-full bg-gradient-to-r from-purple-500 to-blue-400" style="width:0%"></div></div>
                <div class="flex justify-between text-[9px] uppercase tracking-wider text-gray-500 mt-1"><span>◀ start · left ear</span><span>end · right ear ▶</span></div>
            </div>` : ''}
            <div class="flex gap-2 mt-3">
                <button id="playEvtBtn" class="flex-1 bg-white/10 hover:bg-white/20 text-white text-xs font-bold py-2 rounded-lg transition"><i class="fa-solid fa-play mr-1"></i>Play this report</button>
                <button id="sweepFromBtn" class="flex-1 bg-white/10 hover:bg-white/20 text-white text-xs font-bold py-2 rounded-lg transition"><i class="fa-solid fa-arrows-left-right mr-1"></i>Sweep from here</button>
            </div>`;
    }

    function showPlaceholder() {
        $('followBtn').classList.add('hidden');
        $('infoBody').innerHTML = `
            <p class="text-xs text-gray-300 mb-3">Press <b>play</b>. As each real event sounds, its story appears here. Click any dot left on the map to pin its details.</p>
            <h4 class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">What you will hear</h4>
            ${Object.entries(INFO).map(([id, i]) => `<p class="text-[11px] text-gray-300 mb-1"><span style="color:${CATS[id].color}"><i class="fa-solid ${i.icon} w-4"></i></span> <b>${i.name}</b> — ${i.sound}</p>`).join('')}
            <p class="text-[11px] text-gray-500 mt-2">Left/right stereo position follows longitude.</p>`;
    }

    // Place name lookup (OpenStreetMap Nominatim), debounced + cached to stay polite
    const geoCache = {}; let geoTimer = null;
    function setGeo(t) { const el = $('geoText'); if (el) el.textContent = t; }
    function scheduleGeocode(e) {
        clearTimeout(geoTimer);
        const key = `${e.lat.toFixed(1)},${e.lng.toFixed(1)}`;
        if (geoCache[key]) { setGeo(geoCache[key]); return; }
        setGeo('Looking up…');
        geoTimer = setTimeout(async () => {
            try {
                const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=6&accept-language=en&lat=${e.lat}&lon=${e.lng}`);
                const j = await r.json();
                let t;
                if (j.error) t = 'Open ocean / remote area';
                else { const a = j.address || {}; t = [a.state || a.region || a.county, a.country].filter(Boolean).join(', ') || j.display_name; }
                geoCache[key] = t;
                if (selectedEvt === e) setGeo(t);
            } catch (err) { if (selectedEvt === e) setGeo('Name unavailable'); }
        }, 800);
    }

    function selectEvent(e, opts = {}) {
        selectedEvt = e;
        if (opts.pin) pinned = true;
        $('followBtn').classList.toggle('hidden', !pinned);
        $('infoBody').innerHTML = renderDetails(e);
        scheduleGeocode(e);
        markSelectedRow(e);
        if (opts.pin) setInfoOpen(true);
    }

    function addDot(e) {
        L.circleMarker([e.lat, e.lng], { radius: 4.5, color: '#fff', weight: 1, fillColor: e.color, fillOpacity: 0.9 })
            .addTo(trail).bindTooltip(esc(e.title) + ' — click to hear it', { direction: 'top' }).on('click', () => pickEvent(e));
    }
    function rebuildTrail() { trail.clearLayers(); events.forEach(e => { if (e.triggered) addDot(e); }); }

    function setInfoOpen(open) {
        $('infoBody').classList.toggle('hidden', !open);
        $('infoChevron').className = `fa-solid ${open ? 'fa-chevron-up' : 'fa-chevron-down'} text-[10px] text-gray-500`;
    }
    $('infoToggle').addEventListener('click', () => setInfoOpen($('infoBody').classList.contains('hidden')));
    $('followBtn').addEventListener('click', () => { pinned = false; $('followBtn').classList.add('hidden'); });
    if (window.innerWidth < 640) setInfoOpen(false);
    showPlaceholder();

    /* ---------- Event list: every event with its own play button ---------- */
    function renderList() {
        const q = ($('listSearch').value || '').trim().toLowerCase();
        const arr = [...stories.values()].sort(mode === 'sweep' ? (a, b) => a.reports[0].lng - b.reports[0].lng : (a, b) => a.start - b.start);
        listOrder = arr.filter(st => !q || `${st.title} ${CATS[st.cat].label}`.toLowerCase().includes(q));
        const shown = listOrder.slice(0, 500);
        const fd = ms => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const box = $('eventList');
        box.innerHTML = shown.map((st, i) => `<div class="evt-row" data-i="${i}">
                <button class="evt-play" title="Play this event, start to end"><i class="fa-solid fa-play ml-px"></i></button>
                <div class="evt-main min-w-0 flex-1 cursor-pointer">
                    <div class="truncate text-xs font-bold"><span class="inline-block w-2 h-2 rounded-full mr-1.5" style="background:${st.color}"></span>${esc(st.title)}</div>
                    <div class="text-[10px] text-gray-400 truncate">${fd(st.start)} → ${st.closed ? fd(st.end) : 'ongoing'} · ${CATS[st.cat].label} · ${st.reports.length} report${st.reports.length === 1 ? '' : 's'}</div>
                </div></div>`).join('') + (listOrder.length > shown.length ? `<p class="text-[10px] text-gray-500 p-3">Showing the first ${shown.length} of ${listOrder.length.toLocaleString()} — use search to narrow down.</p>` : '');
        rowEls = new Map(); lastRowEl = null;
        shown.forEach((st, i) => rowEls.set(st, box.children[i]));
        $('listCount').textContent = listOrder.length.toLocaleString();
        if (selectedEvt) markSelectedRow(selectedEvt);
    }

    function markSelectedRow(e) {
        if (lastRowEl) lastRowEl.classList.remove('sel');
        const el = rowEls.get(stories.get(e.id));
        lastRowEl = el || null;
        if (el) {
            el.classList.add('sel');
            if (!$('listBody').classList.contains('hidden')) el.scrollIntoView({ block: 'nearest' });
        }
    }

    $('eventList').addEventListener('click', ev => {
        const row = ev.target.closest('.evt-row');
        if (!row) return;
        const st = listOrder[+row.dataset.i];
        if (!st) return;
        selectEvent(st.reports[0], { pin: true });
        if (ev.target.closest('.evt-play')) playStory(st);                       // hear this whole event
        else showStoryOnMap(st, false);                                           // find this event
    });
    $('listSearch').addEventListener('input', renderList);
    function setListOpen(open) {
        $('listBody').classList.toggle('hidden', !open);
        $('listChevron').className = `fa-solid ${open ? 'fa-chevron-up' : 'fa-chevron-down'} text-[10px] text-gray-500`;
    }
    $('listToggle').addEventListener('click', () => setListOpen($('listBody').classList.contains('hidden')));
    if (window.innerWidth < 640) setListOpen(false);

    /* ---------- One event, start -> end: fades in, pans left -> right, fades out ---------- */
    function buildStories() {
        stories = new Map();
        events.forEach(e => {
            let st = stories.get(e.id);
            if (!st) { st = { id: e.id, title: e.title, cat: e.cat, color: e.color, closed: e.closed, reports: [] }; stories.set(e.id, st); }
            st.reports.push(e);
        });
        stories.forEach(st => {
            st.reports.sort((a, b) => a.date - b.date);
            st.start = st.reports[0].date;
            const last = st.reports[st.reports.length - 1].date;
            st.end = st.closed ? Math.max(last, new Date(st.closed).getTime()) : last;
        });
    }

    // 0 at the very start, 1 through the middle, 0 at the very end (smooth) = the "proximity" swell
    function storyEnv(f) {
        const x = Math.max(0, Math.min(1, f / 0.25, (1 - f) / 0.25));
        return x * x * (3 - 2 * x);
    }

    function refreshStoryBtn() {
        const b = $('playStoryBtn');
        if (!b) return;
        const on = story && selectedEvt && story.s.id === selectedEvt.id;
        b.innerHTML = on ? '<i class="fa-solid fa-stop mr-1"></i>Stop' : '<i class="fa-solid fa-play mr-1"></i>Play event start → end';
    }

    function showStoryOnMap(st, drawing = true) {
        storyLayer.clearLayers();
        const pts = st.reports.map(r => [r.lat, r.lng]);
        if (drawing) {
            if (pts.length > 1) L.polyline(pts, { color: st.color, weight: 3, opacity: 0.8, dashArray: '6 6', interactive: false }).addTo(storyLayer);
            L.circleMarker(pts[0], { radius: 6, color: '#fff', weight: 2, fillColor: '#22c55e', fillOpacity: 1 }).bindTooltip('Start', { permanent: true, direction: 'top' }).addTo(storyLayer);
            if (pts.length > 1) L.circleMarker(pts[pts.length - 1], { radius: 6, color: '#fff', weight: 2, fillColor: '#f87171', fillOpacity: 1 }).bindTooltip(st.closed ? 'End' : 'Latest', { permanent: true, direction: 'top' }).addTo(storyLayer);
        }
        if (pts.length > 1) map.flyToBounds(L.latLngBounds(pts), { maxZoom: 6, padding: [90, 90], duration: 0.9 });
        else map.flyTo(pts[0], Math.max(map.getZoom(), 5), { duration: 0.9 });
        ping(st.reports[0]);
    }

    async function playStory(st) {
        if (!st) return;
        await Tone.start();
        if (story && story.s === st) { stopStory(); return; }       // press again = stop
        stopStory(); stopPlayback();
        const n = st.reports.length;
        const days = (st.end - st.start) / 86400000;
        const L_s = Math.max(4, Math.min(12, 4 + days * 0.8)) / speed;           // seconds, longer events play longer
        // each report sits at its real position in time between the event's start and end (kept away from the very ends)
        const offs = st.reports.map((r, i) => st.end > st.start ? 0.1 + 0.8 * (r.date - st.start) / (st.end - st.start) : 0.1 + 0.8 * (n === 1 ? 0.5 : i / (n - 1)));
        const bed = BED[st.cat];
        bedNoise.type = bed.noise; bedFilter.type = bed.ftype; bedFilter.frequency.value = bed.freq; bedNoise.volume.value = bed.vol;
        const now = Tone.now();
        master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(0, now);
        panner.pan.cancelScheduledValues(now); panner.pan.setValueAtTime(-1, now);
        bedNoise.start();
        const t = now + 0.05;                                                      // START cue: rising, left ear
        cuePanner.pan.setValueAtTime(-0.9, t);
        cueSynth.triggerAttackRelease('G4', '16n', t);
        cueSynth.triggerAttackRelease('C5', '8n', t + 0.12);
        story = { s: st, L: L_s, t0: performance.now(), idx: 0, offs, dot: null };
        showStoryOnMap(st);
        story.dot = L.circleMarker([st.reports[0].lat, st.reports[0].lng], { radius: 7, color: '#fff', weight: 2, fillColor: st.color, fillOpacity: 1, interactive: false }).addTo(storyLayer);
        refreshStoryBtn();
    }

    function updateStory() {
        const st = story.s, rs = st.reports, f = (performance.now() - story.t0) / (story.L * 1000);
        if (f >= 1) { endStory(true); return; }
        const env = storyEnv(f);
        master.gain.rampTo(env, 0.06);                                             // louder towards the middle, quiet at both ends
        panner.pan.rampTo(-1 + 2 * f, 0.06);                                        // left -> right across the event
        bedFilter.frequency.rampTo(BED[st.cat].freq * (0.7 + 0.6 * env), 0.1);
        while (story.idx < rs.length && f >= story.offs[story.idx]) {
            const r = rs[story.idx++];
            playEvent(r, 0.95, { noPan: true });
            ping(r);
        }
        // travelling dot, interpolated between reports in time
        let k = 0;
        while (k < rs.length - 1 && f >= story.offs[k + 1]) k++;
        const a = rs[k], b = rs[Math.min(k + 1, rs.length - 1)];
        const span = (story.offs[Math.min(k + 1, rs.length - 1)] - story.offs[k]) || 1;
        const u = f < story.offs[0] ? 0 : Math.max(0, Math.min(1, (f - story.offs[k]) / span));
        story.dot.setLatLng([a.lat + (b.lat - a.lat) * u, a.lng + (b.lng - a.lng) * u]);
        story.dot.setRadius(5 + 8 * env);
        const bar = $('storyBar'); if (bar) bar.style.width = (f * 100) + '%';
    }

    function endStory(natural) {
        if (!story) return;
        if (natural) {                                                             // END cue: falling, right ear
            const t = Tone.now() + 0.02;
            cuePanner.pan.setValueAtTime(0.9, t);
            cueSynth.triggerAttackRelease('C5', '16n', t);
            cueSynth.triggerAttackRelease('G4', '8n', t + 0.12);
        }
        stopStory();
    }

    function stopStory() {
        if (!story) return;
        story = null;
        try { bedNoise.stop(); } catch (e) { /* already stopped */ }
        const now = Tone.now();
        master.gain.cancelScheduledValues(now); master.gain.rampTo(1, 0.2);       // restore normal volume for everything else
        panner.pan.cancelScheduledValues(now); panner.pan.value = 0;
        storyLayer.clearLayers();
        const bar = $('storyBar'); if (bar) bar.style.width = '0%';
        refreshStoryBtn();
    }

    /* ---------- Pick a specific event: select it, pin it, hear it ---------- */
    async function auditionEvent(e, gain = 0.9) {
        await Tone.start();
        playEvent(e, gain);
        ping(e);
    }
    function pickEvent(e) {
        selectEvent(e, { pin: true });
        const st = stories.get(e.id);
        if (st) playStory(st); else auditionEvent(e);
    }

    // Buttons inside the details panel (the panel is re-rendered, so use delegation)
    $('infoBody').addEventListener('click', async ev => {
        const e = selectedEvt;
        if (!e) return;
        if (ev.target.closest('#playStoryBtn')) { playStory(stories.get(e.id)); return; }
        if (ev.target.closest('#playEvtBtn')) { auditionEvent(e, 1); return; }
        if (ev.target.closest('#sweepFromBtn')) {
            await Tone.start();
            if (mode !== 'sweep') setMode('sweep');           // rebuilds event objects, so re-find ours
            const target = events.find(x => x.id === e.id && x.date === e.date && x.lat === e.lat && x.lng === e.lng) || e;
            playProgress = Math.max(0, Math.min(0.999, (target.lng - PROX_DEG + 180) / 360));   // start just west so the sound fades in
            events.forEach(x => { x._next = 0; });
            updateUI(); renderSweepFrame(false);
            selectEvent(target, { pin: true });
            startPlayback();
        }
    });

    $('daysSelect').addEventListener('change', loadEonetData);

    $('legend').addEventListener('click', e => {
        const b = e.target.closest('[data-cat]');
        if (!b || b.disabled) return;
        activeCat = b.dataset.cat;
        applyFilter();
    });

    loadEonetData();
    requestAnimationFrame(animateTimeline);
    </script>
</body>
</html>
