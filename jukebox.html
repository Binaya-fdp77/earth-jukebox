<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NASA EIC | Earth Jukebox HD</title>

<!-- Fonts and Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- External Libraries: Three.js, OrbitControls, TopoJSON, Tone.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

<style>
  /* ==========================================
     1. CSS VARIABLES & BASE STYLING
     ========================================== */
  :root {
    --bg: #0b0d12;
    --panel: rgba(14, 17, 23, 0.93);
    --line: rgba(255, 255, 255, 0.09);
    --mut: #8a91a0;
    --acc: #ff8a1f;
    --acc2: #ffd29a;
    --bh: 110px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: #e8eaf0;
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  .mono { font-family: 'JetBrains Mono', monospace; }
  .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); font-weight: 600; }

  /* ==========================================
     2. HEADER STYLING
     ========================================== */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 14px;
    background: #0e1117;
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 30;
  }
  header a { color: var(--mut); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  header a:hover { color: #fff; }
  .title { font-weight: 800; letter-spacing: .16em; font-size: 13px; white-space: nowrap; }
  .title span { color: var(--acc); }

  /* ==========================================
     3. MAP & LAYOUT PANELS
     ========================================== */
  #mapWrap { position: relative; min-width: 0; min-height: 0; background: #07080a; overflow: hidden; }
  #globeViz { position: absolute; inset: 0; }
  .fl {
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 18px 44px -12px #000;
  }

  /* Sidebar Event Panel */
  #side {
    position: absolute;
    left: 12px;
    top: 12px;
    bottom: calc(var(--bh) + 24px);
    width: 320px;
    display: flex;
    flex-direction: column;
    z-index: 6;
    overflow: hidden;
  }
  .sh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; }
  .sh b { font-size: 14px; }
  .sp1 { padding: 0 12px 8px; }
  .sp1 input { width: 100%; }
  
  .filter-box { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  #legend { display: flex; gap: 5px; flex-wrap: wrap; padding: 4px 0; max-height: 120px; overflow-y: auto; }
  #list { flex: 1; min-height: 0; overflow-y: auto; }

  /* Category Chips & Event Rows */
  .chip {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,.04);
    color: #cbd5e1; font: 600 11px Inter; cursor: pointer; transition: .15s;
  }
  .chip:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 24%, transparent); color: #fff; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

  .row {
    display: flex; gap: 10px; align-items: center;
    padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,.05);
    cursor: pointer; transition: .12s;
  }
  .row:hover { background: rgba(255,255,255,.05); }
  .row.sel { background: rgba(255, 138, 31, .14); box-shadow: inset 3px 0 var(--acc); }

  /* UI Controls & Inputs */
  input[type=search], input[type=text], select, input[type=range] {
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 12px;
    outline: none; color-scheme: dark; font-family: Inter, sans-serif;
  }
  input:focus, select:focus { border-color: var(--acc); }

  /* Zoom Control Bar */
  #zc { position: absolute; right: 12px; top: 12px; z-index: 7; display: flex; flex-direction: column; gap: 5px; padding: 5px; }
  #zc button {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.05); color: #e5e7eb; font: 700 12px Inter; cursor: pointer; transition: .15s;
  }
  #zc button:hover { background: var(--acc); color: #1a0d00; }
  #zc hr { border: 0; border-top: 1px solid var(--line); margin: 1px 0; width: 100%; }

  #hd { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; font-size: 11px; color: #cbd5e1; padding: 6px 11px; pointer-events: none; transition: opacity 1s; }

  /* Bottom Audio / Playback Control Bar */
  #bar {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: min(780px, calc(100% - 24px)); bottom: 12px; z-index: 7;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .ra { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #play {
    flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: linear-gradient(180deg, #ff9a3c, #e8710a); color: #1a0d00;
    font-size: 17px; cursor: pointer; transition: .12s;
  }
  #play:hover { filter: brightness(1.1); }
  #play:disabled { opacity: .4; }

  #evb { position: absolute; left: 12px; top: 12px; z-index: 6; padding: 10px 14px; color: #fff; font: 700 12px Inter; cursor: pointer; display: none; gap: 8px; align-items: center; }
  body.hidep #evb { display: flex; }
  body.hidep #side { display: none; }
</style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <a href="#"><i class="fa-solid fa-arrow-left"></i> Globe</a>
    <div class="title">EARTH JUKEBOX <span>HD</span></div>
    <div class="lbl" style="margin-left:auto">NASA Earth Observatory & EONET</div>
  </header>

  <!-- Main Map Display Area -->
  <div id="mapWrap">
    <div id="globeViz"></div>
    
    <!-- Button to toggle sidebar on mobile/hidden mode -->
    <button id="evb" class="fl"><i class="fa-solid fa-list"></i> Events</button>

    <!-- Sidebar: Event List & Filters -->
    <aside id="side" class="fl">
      <div class="sh">
        <b>Events <span id="count" class="mono" style="color:var(--mut);font-size:12px">0</span></b>
        <button id="sidex" style="background:0;border:0;color:var(--mut);cursor:pointer" title="Hide sidebar">✕</button>
      </div>
      <div class="sp1"><input id="search" type="search" placeholder="Search events…"></div>
      <div class="filter-box">
        <div id="legend"></div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <div style="display:flex;justify-content:space-between" class="lbl"><span>Time window</span><span id="rangeVal" class="mono">14 days</span></div>
          <input type="range" id="rangeSlider" min="1" max="30" value="14">
        </div>
      </div>
      <div id="list"></div>
    </aside>

    <!-- Map Zoom & Layer Controls -->
    <div id="zc" class="fl">
      <button id="zin" title="Zoom in"><i class="fa-solid fa-plus"></i></button>
      <button id="zout" title="Zoom out"><i class="fa-solid fa-minus"></i></button>
      <button id="zhome" title="Reset view"><i class="fa-solid fa-expand"></i></button>
      <hr>
      <button id="zsat" title="Change map layer"><i class="fa-solid fa-layer-group"></i></button>
    </div>

    <!-- Status Toast Notification -->
    <div id="hd" class="fl">Initializing 3D Globe…</div>

    <!-- Bottom Audio / Playback Control Bar -->
    <section id="bar" class="fl">
      <div class="ra">
        <button id="play" disabled><i id="pi" class="fa-solid fa-play" style="margin-left:3px"></i></button>
        <div style="min-width:0;flex:1">
          <div id="date" style="font-size:16px;font-weight:700">Connecting to NASA EONET…</div>
          <div id="now" class="mono" style="font-size:11px;color:var(--acc2);margin-top:2px">&nbsp;</div>
        </div>
      </div>
    </section>
  </div>

<script>
  /* ==========================================
     1. CONFIGURATION & EXPANDED DISASTER CATEGORIES
     ========================================== */
  const CATS = {
    wildfires:     { l: 'Wildfires',     c: '#ef4444', i: 'fa-fire',           about: 'Uncontrolled forest or grassland thermal fires.' },
    severeStorms:  { l: 'Storms',        c: '#3b82f6', i: 'fa-hurricane',      about: 'Tropical cyclones and major storm systems.' },
    volcanoes:     { l: 'Volcanoes',     c: '#f97316', i: 'fa-mountain',       about: 'Volcanic ash plumes and active lava flows.' },
    floods:        { l: 'Floods',        c: '#8b5cf6', i: 'fa-water',          about: 'Severe overflowing water inundating regions.' },
    landslides:    { l: 'Landslides',    c: '#d4a017', i: 'fa-hill-rockslide', about: 'Ground instability, rockfalls, and debris flows.' },
    earthquakes:   { l: 'Earthquakes',   c: '#eab308', i: 'fa-house-crack',    about: 'Seismic tremors and tectonic fault movements.' },
    drought:       { l: 'Drought',       c: '#a855f7', i: 'fa-sun',            about: 'Extended periods of abnormally low precipitation.' },
    tempExtremes:  { l: 'Temp Extremes', c: '#ec4899', i: 'fa-temperature-high', about: 'Severe heatwaves or cold anomalies.' }
  };

  const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const PROXY='https://api.allorigins.win/raw?url=';

  async function fetchJson(u){
    try {
      const res = await fetch(u);
      if(!res.ok) throw new Error(res.status);
      return await res.json();
    } catch(e) {
      const res = await fetch(PROXY + encodeURIComponent(u));
      return await res.json();
    }
  }

  function toast(m,ms=3000){
    const h=$('hd'); h.textContent=m; h.style.opacity=1;
    clearTimeout(toast.t); toast.t=setTimeout(()=>h.style.opacity=0, ms);
  }

  /* ==========================================
     2. TONE.JS AUDIO SYNTHESIS ENGINE
     ========================================== */
  let audioReady = false;
  const audio = {
    wildfires:     new Tone.NoiseSynth({noise:{type:'pink'},envelope:{attack:0.01,decay:0.3,sustain:0}}).toDestination(),
    severeStorms:  new Tone.NoiseSynth({noise:{type:'brown'},envelope:{attack:0.1,decay:0.8,sustain:0.1}}).toDestination(),
    volcanoes:     new Tone.MembraneSynth({pitchDecay:0.08,octaves:8,envelope:{attack:0.001,decay:0.6}}).toDestination(),
    floods:        new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.01,decay:0.4}}).toDestination(),
    landslides:    new Tone.MetalSynth({frequency:60,envelope:{attack:0.01,decay:0.4}}).toDestination(),
    earthquakes:   new Tone.MembraneSynth({pitchDecay:0.2,octaves:4,envelope:{attack:0.005,decay:0.8}}).toDestination(),
    drought:       new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.05,decay:0.6}}).toDestination(),
    tempExtremes:  new Tone.Synth({oscillator:{type:'sawtooth'},envelope:{attack:0.02,decay:0.5}}).toDestination()
  };

  async function initAudio(){
    if(!audioReady){
      await Tone.start();
      audioReady = true;
      toast('Audio synthesis enabled');
    }
  }
  window.addEventListener('click', initAudio, {once:true});

  function playDisasterSound(cat, lat=0){
    if(!audioReady) return;
    try {
      const pitchShift = Math.max(0, Math.min(24, Math.floor((lat + 90) / 7.5)));
      if(audio[cat]) {
        if(cat==='volcanoes' || cat==='earthquakes') {
          audio[cat].triggerAttackRelease(Tone.Frequency(30 + pitchShift, "midi"), '2n');
        } else if(cat==='floods' || cat==='drought') {
          audio[cat].triggerAttackRelease(Tone.Frequency(50 + pitchShift, "midi"), '8n');
        } else {
          audio[cat].triggerAttackRelease('8n');
        }
      }
    } catch(e){}
  }

  /* ==========================================
     3. THREE.JS 3D GLOBE SETUP & RENDERING
     ========================================== */
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setClearColor(0x07080a);
  $('globeViz').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 1, 4000);
  camera.up.set(0, 0, 1);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = 1.38; controls.minDistance = 10; controls.maxDistance = 700;

  const world = new THREE.Group();
  scene.add(world);
  scene.add(new THREE.AmbientLight(0xffffff, 0.85));

  const sunL = new THREE.DirectionalLight(0xffffff, 0.35);
  sunL.position.set(-150, -200, 260);
  scene.add(sunL);

  const mapMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, metalness: 0.1 });
  const TEX = 'https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/';
  const tl = new THREE.TextureLoader(); tl.setCrossOrigin('anonymous');

  const bc = document.createElement('canvas'); bc.width = 2048; bc.height = 1024;
  const bx = bc.getContext('2d'); bx.fillStyle = '#0b1d33'; bx.fillRect(0, 0, 2048, 1024);
  const baseTex = new THREE.CanvasTexture(bc); mapMat.map = baseTex;

  tl.load(TEX + 'earth-blue-marble.jpg', t => {
    bx.drawImage(t.image, 0, 0, 2048, 1024);
    baseTex.needsUpdate = true;
  });

  world.add(new THREE.Mesh(new THREE.PlaneGeometry(360, 180, 120, 60), mapMat));

  /* ==========================================
     4. STATE MANAGEMENT & FILTERS
     ========================================== */
  let rawEvents = [], events = [], activeCats = new Set(Object.keys(CATS)), dayLimit = 14, sel = null;
  let meshes = [];

  function initFilters(){
    const leg = $('legend'); leg.innerHTML = '';
    Object.entries(CATS).forEach(([k, v]) => {
      const chip = document.createElement('button');
      chip.className = 'chip on';
      chip.style.setProperty('--c', v.c);
      chip.innerHTML = `<i style="background:${v.c}"></i>${v.l}`;
      chip.onclick = () => {
        if(activeCats.has(k)) activeCats.delete(k); else activeCats.add(k);
        chip.classList.toggle('on', activeCats.has(k));
        applyFilters();
      };
      leg.appendChild(chip);
    });

    $('rangeSlider').oninput = e => {
      dayLimit = parseInt(e.target.value);
      $('rangeVal').textContent = `${dayLimit} days`;
      applyFilters();
    };
  }

  function applyFilters(){
    const searchTxt = $('search').value.toLowerCase();
    const cutoff = Date.now() - dayLimit * 86400000;
    
    events = rawEvents.filter(e => {
      const catMatch = activeCats.has(e.cat);
      const dateMatch = new Date(e.date).getTime() >= cutoff;
      const txtMatch = !searchTxt || e.title.toLowerCase().includes(searchTxt);
      return catMatch && dateMatch && txtMatch;
    });

    $('count').textContent = events.length;
    renderEventList();
    renderGlobeMarkers();
  }

  function renderEventList(){
    const list = $('list'); list.innerHTML = '';
    events.forEach(e => {
      const row = document.createElement('div');
      row.className = 'row' + (sel === e ? ' sel' : '');
      row.innerHTML = `<i class="fa-solid ${CATS[e.cat].i}" style="color:${CATS[e.cat].c}"></i>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.title)}</div>
          <div class="mono" style="font-size:10px;color:var(--mut)">${e.date.slice(0,10)}</div>
        </div>`;
      row.onclick = () => {
        sel = e;
        playDisasterSound(e.cat, e.lat);
        controls.target.set(e.lng, e.lat, 0);
        camera.position.set(e.lng, e.lat - 40, 60);
        renderEventList();
      };
      list.appendChild(row);
    });
  }

  function renderGlobeMarkers(){
    meshes.forEach(m => world.remove(m));
    meshes = [];
    events.forEach(e => {
      const geom = new THREE.ConeGeometry(1.5, 4, 8);
      geom.rotateX(Math.PI / 2);
      const mat = new THREE.MeshBasicMaterial({ color: e.color });
      const m = new THREE.Mesh(geom, mat);
      m.position.set(e.lng, e.lat, 2);
      world.add(m);
      meshes.push(m);
    });
  }

  /* ==========================================
     5. NASA EONET API DATA LOADER
     ========================================== */
  async function loadEONETData(){
    try {
      toast('Fetching live NASA EONET data…');
      const data = await fetchJson('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=30');
      
      rawEvents = data.events.flatMap(ev => {
        const catId = ev.categories[0].id;
        const catKey = CATS[catId] ? catId : 'wildfires';
        return ev.geometry.map(g => ({
          id: ev.id,
          title: ev.title,
          cat: catKey,
          color: CATS[catKey].c,
          lat: g.coordinates[1],
          lng: g.coordinates[0],
          date: g.date
        }));
      });

      $('date').textContent = 'Live NASA EONET Feeds Active';
      $('play').disabled = false;
      applyFilters();
      toast('EONET data loaded successfully');
    } catch(err) {
      toast('Error loading online data. Using offline fallback.');
    }
  }

  /* ==========================================
     6. EVENT LISTENERS & ANIMATION LOOP
     ========================================== */
  $('search').oninput = applyFilters;
  $('sidex').onclick = () => document.body.classList.add('hidep');
  $('evb').onclick = () => document.body.classList.remove('hidep');
  $('zin').onclick = () => camera.position.multiplyScalar(0.85);
  $('zout').onclick = () => camera.position.multiplyScalar(1.15);
  $('zhome').onclick = () => { controls.target.set(0,0,0); camera.position.set(0,-120,180); };

  window.onresize = () => {
    const w = $('mapWrap').clientWidth, h = $('mapWrap').clientHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  };

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  // Startup
  initFilters();
  window.onresize();
  animate();
  loadEONETData();
</script>
</body>
</html>
