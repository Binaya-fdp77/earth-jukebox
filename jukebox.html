 if(mode==='sweep'){const l=-180+360*prog;$('date').textContent=`Sweeping ${Math.abs(l).toFixed(0)}° ${l<0?'W':'E'}`;}
 else{const ms=range.s+(range.e-range.s)*prog,n=Math.ceil((range.e-range.s)/864e5);$('date').textContent=`Day ${Math.min(n,Math.floor((ms-range.s)/864e5)+1)} of ${n} · `+new Date(ms).toLocaleDateString(undefined,{month:'long',day:'numeric'});}}

function frame(now){

 if(playing){if(!story&&master.gain.value<.99)master.gain.rampTo(1,.1);prog+=dt*speed/(mode==='sweep'?SWEEP_MS:DATE_MS);
  if(prog>=1){prog=1;playing=false;_stop();if($('mSweep')&&(mode==='date'||LOOP)){setMode(mode==='date'?'sweep':'date');start();}}
  if(mode==='date'){const cur=range.s+(range.e-range.s)*prog;let latest=null;
   for(const e of events){if(e.date>cur)break;if(e.done)continue;e.done=true;if(now-(window._ls||0)>80){window._ls=now;sound(e,1,true);}ring(e);latest=e;}
   if(latest){sel=latest;details(latest);mark();paint();$('now').textContent=`♪ ${CATS[latest.cat].l}: ${latest.title}`;}}
  else{const lng=-180+360*prog;sweepTo(lng);
   if(now>=nextTick){nextTick=now+110;const c=[];let near=null,nd=1e9;
    for(const e of events){const d=Math.abs(e.lng-lng);if(d<nd){nd=d;near=e;}if(d<PROX&&now>=e.next)c.push({e,p:1-d/PROX});}
    c.sort((a,b)=>b.p-a.p).slice(0,2).forEach(({e,p})=>{e.next=now+800-500*p;sound(e,Math.pow(p,1.4)*.95,true);ring(e);});
    if(near&&nd<PROX){sel=near;$('now').textContent=`♪ ${CATS[near.cat].l}: ${near.title}`;}}}
  ui();}
 try{updBeacon(now);}catch(err){}
  if(story){try{updateStory();}catch(err){console.warn(err);endStory(false);}}
 requestAnimationFrame(frame);}

(function(){
 function wrap(x,kind){let last=0;
  const idx=kind==='n'?{triggerAttack:0,triggerAttackRelease:1}:{triggerAttack:1,triggerAttackRelease:2};
  Object.keys(idx).forEach(m=>{
   if(typeof x[m]!=='function')return;
   const o=x[m].bind(x),i=idx[m];
   x[m]=function(...a){
    const now=Tone.now();let t=(typeof a[i]==='number')?a[i]:now;
    if(last-now>.5)last=now;t=Math.max(t,now,last+.012);
    if(t-now>4)return;
    last=t;a[i]=t;
    try{return o(...a);}catch(err){console.warn('note skipped',err.message);}
   };
  });
 }
 [drop,boom,quake,wail,brass,sub,bubble,cue,pluck].forEach(x=>wrap(x,'s'));
 [fire,flame,wind,slide,rumble,dry,breeze,haze,thunder].forEach(n=>wrap(n.s,'n'));
 wrap(cicada,'n');
})();

 const t=Tone.now(),T=f=>{try{f();}catch(e){}};
 [fire,flame,wind,slide,rumble,dry,breeze,haze,thunder].forEach(n=>T(()=>n.s.triggerRelease(t)));

 [drop,boom,quake,wail,brass,sub,bubble,cue].forEach(x=>T(()=>x.triggerRelease(t)));

npTag.style.cssText='position:fixed;z-index:30;pointer-events:none;display:none;transform:translate(-50%,-100%);padding:5px 10px;border-radius:8px;background:rgba(10,12,16,.9);border:2px solid #fff;color:#fff;font:600 12px Inter,sans-serif;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5)';

const _bv=new THREE.Vector3();let npShown=null;
function updBeacon(now){
 const on=(playing||story)&&np&&performance.now()-npT<2500;
 if(!on){bcn.visible=false;npTag.style.display='none';return;}
 if(npShown!==np){npShown=np;bcnMat.color.set(np.color);npTag.style.borderColor=np.color;
  const c=CATS[np.cat]||{};npTag.innerHTML='<i class="fa-solid '+(c.i||'fa-music')+'" style="color:'+np.color+'"></i> '+esc(c.l||'')+' \u00b7 '+esc(String(np.title||'').slice(0,48));}
 bcn.visible=true;bcn.position.set(np.lng,np.lat,0);bcnRing.scale.setScalar(1+.3*Math.sin(now/110));
 _bv.set(np.lng,np.lat,32).project(camera);
 if(_bv.z>1||_bv.z<-1){npTag.style.display='none';return;}
 const r=renderer.domElement.getBoundingClientRect();
 npTag.style.display='block';npTag.style.left=(r.left+(_bv.x*.5+.5)*r.width)+'px';npTag.style.top=(r.top+(-_bv.y*.5+.5)*r.height)+'px';}

(function(){
 const st=document.createElement('style');
 st.textContent='#rp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bh) + 24px);z-index:9;display:none;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}#rp button{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:rgba(255,255,255,.08);color:#fff;font:700 12px Inter,sans-serif;cursor:pointer}#rp button:hover{background:var(--acc);color:#1a0d00}#rdot{color:#ef4444;font-size:14px}#rdot.p{color:#8a91a0}#rdot.on{animation:rb 1s infinite}@keyframes rb{50%{opacity:.25}}#rres{display:none;align-items:center;gap:8px;flex-wrap:wrap}#rrec{display:flex;align-items:center;gap:10px}';
 document.head.appendChild(st);
 const rp=document.createElement('div');rp.id='rp';rp.className='fl';
 rp.innerHTML='<div id="rrec"><span id="rdot" class="on">&#9679;</span><span id="rt" class="mono" style="font-size:13px">00:00</span><button id="rpause">&#10074;&#10074; Pause</button><button id="rstop">&#9632; Stop</button></div><div id="rres"><span class="lbl">Your track</span><audio id="raud" controls style="height:34px"></audio><button id="rdl">&#11015; Download</button><button id="rdisc">Discard</button></div>';
 $('mapWrap').appendChild(rp);
 let rr=null,meter=null,rec=false,paused=false,t0=0,acc=0,tm=null,url=null,fileBlob=null,ext='wav',peak=-100;
 const fmt=ms=>{const x=Math.floor(ms/1000);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');};
 const el=()=>acc+(rec&&!paused?performance.now()-t0:0);
 const view=m=>{rp.style.display=m?'flex':'none';$('rrec').style.display=m==='rec'?'flex':'none';$('rres').style.display=m==='res'?'flex':'none';};
 const zr=$('zrec');
 function wav(b){const n=b.length,c=Math.min(2,b.numberOfChannels),sr=b.sampleRate,ba=c*2,buf=new ArrayBuffer(44+n*ba),v=new DataView(buf);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*ba,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,c,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ba,true);v.setUint16(32,ba,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*ba,true);
  const ch=[];for(let i=0;i<c;i++)ch.push(b.getChannelData(i));let o=44;
  for(let i=0;i<n;i++)for(let k=0;k<c;k++){const x=Math.max(-1,Math.min(1,ch[k][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2;}
  return new Blob([buf],{type:'audio/wav'});}
 function clearRes(){if(url){URL.revokeObjectURL(url);url=null;}fileBlob=null;$('raud').removeAttribute('src');}
 async function rStart(){
  await Tone.start();clearRes();
  if(!rr){rr=new Tone.Recorder();master.connect(rr);cuePan.connect(rr);try{meter=new Tone.Meter();master.connect(meter);}catch(e){meter=null;}}
  peak=-100;acc=0;paused=false;await rr.start();t0=performance.now();rec=true;
  $('rpause').innerHTML='&#10074;&#10074; Pause';$('rdot').className='on';view('rec');
  clearInterval(tm);tm=setInterval(()=>{if(meter){try{const v=meter.getValue();if(typeof v==='number'&&v>peak)peak=v;}catch(e){}}
   $('rt').textContent=fmt(el())+(meter&&peak<-80?' \u00b7 no sound yet (press play)':'');},200);
  zr.style.background='#dc2626';zr.style.color='#fff';toast('Recording... press play on the bar to capture the sounds',4000);}
 async function rStop(){
  if(!rec)return;if(!paused)acc+=performance.now()-t0;rec=false;clearInterval(tm);zr.style.background='';zr.style.color='';
  let blob;try{blob=await rr.stop();}catch(e){toast('Stop failed: '+e.message,6000);view(null);return;}
  if(!blob||!blob.size){toast('Nothing was recorded');view(null);return;}
  try{const ab=await blob.arrayBuffer(),buf=await Tone.context.rawContext.decodeAudioData(ab);fileBlob=wav(buf);ext='wav';}
  catch(err){fileBlob=blob;ext=blob.type.includes('ogg')?'ogg':'webm';}
  url=URL.createObjectURL(fileBlob);$('raud').src=url;view('res');
  toast(meter&&peak<-80?'Recorded, but it is silent. Press play while recording.':'Track ready: listen or download',5000);}
 $('rpause').onclick=()=>{if(!rec||!rr)return;const m=rr._recorder||rr;
  if(!paused){acc+=performance.now()-t0;try{m.pause();}catch(e){}paused=true;$('rpause').innerHTML='&#9658; Resume';$('rdot').className='p';}
  else{t0=performance.now();try{m.resume();}catch(e){}paused=false;$('rpause').innerHTML='&#10074;&#10074; Pause';$('rdot').className='on';}};
 $('rstop').onclick=rStop;
 $('rdl').onclick=()=>{if(!fileBlob)return;const d=new Date(),p=x=>String(x).padStart(2,'0'),a=document.createElement('a');
  a.href=url;a.download='earth-jukebox-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.'+ext;a.click();};
 $('rdisc').onclick=()=>{clearRes();view(null);};
